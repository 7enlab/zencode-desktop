[package]
name = "zencode_engine"
version = "0.3.0-dev"
edition = "2021"
license = "MIT"
description = "ZenCode Desktop engine: thin wrapper over ZenCode CLI crates (zen-agent/zen-tools/zen-core)"

[dependencies]
zen-core = { git = "https://gitlab.com/atzenn/zencode.git", rev = "250e8d4" }
zen-agent = { git = "https://gitlab.com/atzenn/zencode.git", rev = "250e8d4" }
zen-tools = { git = "https://gitlab.com/atzenn/zencode.git", rev = "250e8d4" }
anyhow = "1"
async-trait = "0.1"
minisign-verify = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }

[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = 0
