






[graph]
targets = [

    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

[advisories]

yanked = "deny"

ignore = []

[licenses]




allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",

    "LicenseRef-ZenCode-FirstParty",
]

confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]

multiple-versions = "warn"




wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://gitlab.com/atzenn/zencode.git"]





[[licenses.clarify]]
crate = "zen-core"
expression = "LicenseRef-ZenCode-FirstParty"
license-files = []

[[licenses.clarify]]
crate = "zen-agent"
expression = "LicenseRef-ZenCode-FirstParty"
license-files = []

[[licenses.clarify]]
crate = "zen-tools"
expression = "LicenseRef-ZenCode-FirstParty"
license-files = []
