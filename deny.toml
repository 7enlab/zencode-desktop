# cargo-deny configuration for zencode-desktop.
# Policy: allow-list of licenses. Strong copyleft (GPL-3.0-only, AGPL) is NOT
# on the allow list, so it fails the check — a legal risk for a shipped desktop app.
# Run per crate from the repo root:
#   cargo deny --manifest-path <crate>/Cargo.toml check licenses advisories bans
# (deny.toml is picked up from the current directory.)

[graph]
targets = [
    # Only the platforms we ship on — keeps the graph small.
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

[advisories]
# Fail CI on any known RUSTSEC advisory; yanked crates are also a hard fail.
yanked = "deny"
# Notes/warnings do not fail the build (informational only).
ignore = []

[licenses]
# Allow-list: permissive + weak copyleft only.
# Deliberately EXCLUDED (deny by omission): GPL-3.0-only, AGPL-1.0/3.0 (any),
# and any other strong copyleft — risky for a closed-source desktop app.
# Weak copyleft (LGPL, MPL-2.0) is allowed: fine when dynamically linked.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
# Only accept high-confidence license detections.
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
# Multiple versions of the same crate bloat the binary and widen the attack surface.
multiple-versions = "warn"
# Wildcard version requirements make builds non-reproducible.
# Note: git dependencies pinned to a rev are flagged as "wildcard" by cargo-deny
# (they have no version requirement), but they are NOT actually wildcards —
# the rev pins them. We warn rather than deny to avoid false positives.
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://gitlab.com/atzenn/zencode.git"]
