name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: rebuild } }
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo build --release
      - run: cargo test --release   # includes golden parity (tests/parity.rs)
      - uses: actions/upload-artifact@v5
        with:
          name: cowsay-${{ matrix.os }}
          path: |
            rebuild/target/release/cowsay
            rebuild/target/release/cowsay.exe
          if-no-files-found: ignore
