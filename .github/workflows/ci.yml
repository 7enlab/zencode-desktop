name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: rebuild } }
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release   # includes golden parity (tests/parity.rs)
      - uses: actions/upload-artifact@v4
        with:
          name: cowsay-${{ matrix.os }}
          path: |
            rebuild/target/release/cowsay
            rebuild/target/release/cowsay.exe
