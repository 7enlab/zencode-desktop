# PR Agent config for ZenCode Desktop (Route A: free-model PR review).
# Adopted from the verified CLI config (7enlab/zencode, PR #2).
# Functional settings are identical to CLI; only this header changed.
# Safety gates decided for Route A:
# - auto-approval OFF (never auto-approve a PR)
# - all models pinned with the :free suffix, fallback across providers
# - fail-closed: if no free model answers, the run fails without spending
# - output_run_details ON so the pilot comment shows which model actually ran
[config]
model = "openrouter/cohere/north-mini-code:free"
fallback_models = [
  "openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free",
  "openrouter/google/gemma-4-31b-it:free",
  "openrouter/liquid/lfm-2.5-2.6b:free",
]
# Conservative cap equal to PR Agent's own max_model_tokens default.
# Refine from the OpenRouter catalog context lengths before any main merge;
# the pilot diff is small, so this cap is not binding for the pilot run.
custom_model_max_tokens = 32000
enable_auto_approval = false
output_run_details = true
