# .gitlab-ci.yml — ZenCode Desktop CI (Muse 2).
#
# Pipelines run on push and merge-request events only. No schedules are
# defined here, and none denser than hourly may be added.
#
# The release-key-check job compares docs/keys/zencode-release.pub with the
# updater pubkey in desktop/src-tauri/tauri.conf.json. It needs NO secret key.
#
# Release signing runs ONLY in CI (0.3-4): the minisign key is stored in the
# masked + protected CI variables TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD, so GitLab only exposes it to jobs on
# protected branches/tags. Only the release-* jobs (protected vX.Y.Z tags) use
# it; no other job may read it, and it must never be committed or printed.

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
    # Manual runs from the UI (Run pipeline) or the API, e.g. after a runner
    # or account change. Still no schedules.
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

stages:
  - lint
  - test
  - security
  - release

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_NET_RETRY: "10"

default:
  image: rust:1-bookworm
  interruptible: true
  before_script:
    - rustup component add rustfmt clippy
    - rustc --version && cargo --version

cache:
  key: cargo-$CI_COMMIT_REF_SLUG
  paths:
    - .cargo/
    - engine/target/

fmt:
  stage: lint
  script:
    - cd engine && cargo fmt --check

clippy:
  stage: lint
  script:
    - cd engine && cargo clippy --all-targets -- -D warnings

test:
  stage: test
  script:
    - cd engine && cargo test --locked

# Compile-check the Tauri desktop crate. Runs only when desktop files change,
# since it needs GTK/WebKit system packages (not in the default image).
desktop-check:
  stage: test
  image: rust:latest
  before_script:
    - rustc --version && cargo --version
    - apt-get update -y && apt-get install -y --no-install-recommends
        pkg-config build-essential curl wget file
        libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
        libayatana-appindicator3-dev librsvg2-dev
  cache:
    key: cargo-desktop-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/
      - desktop/src-tauri/target/
  script:
    - cd desktop/src-tauri && cargo check --locked
  rules:
    - changes:
        - desktop/**/*

cargo-deny:
  stage: security
  before_script:
    - cargo install --locked cargo-deny
    - cargo deny --version
  script:
    # deny.toml is picked up from the current directory (repo root).
    - cargo deny --manifest-path engine/Cargo.toml check licenses advisories bans

release-key-check:
  stage: security
  image: alpine:latest
  before_script: []
  cache: {}
  script:
    - sh tools/check-release-key.sh

# --- Release (0.3-4): protected vX.Y.Z tags only --------------------------
# Builds the Linux AppImage, re-signs it under a versioned name so the signed
# trusted comment carries the version, writes latest.json, uploads both to the
# generic package registry and creates the GitLab release whose latest.json
# link backs the updater endpoint
# (/-/releases/permalink/latest/downloads/latest.json).
release-linux:
  stage: release
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/
  cache: {}
  variables:
    APPIMAGE_EXTRACT_AND_RUN: "1"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file curl >/dev/null
    - cargo install tauri-cli --version "^2" --locked
  script:
    - tools/release-linux.sh "$CI_COMMIT_TAG" dist/
    - PKG="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zencode-desktop/${CI_COMMIT_TAG}"
    - 'for f in dist/*; do curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$PKG/$(basename "$f")"; echo; done'
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

release-publish:
  stage: release
  needs: [release-linux]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  cache: {}
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/
  script:
    - echo "Publishing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "ZenCode Desktop $CI_COMMIT_TAG"
    description: "See CHANGELOG.md. Updater manifest: latest.json (signed-version checked)."
    assets:
      links:
        - name: latest.json
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zencode-desktop/${CI_COMMIT_TAG}/latest.json"
          direct_asset_path: /latest.json
